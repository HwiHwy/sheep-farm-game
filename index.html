<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eff5eb" />
  <title>Mini Game World</title>
  <link rel="stylesheet" href="./hub.css" />
</head>
<body>
  <main id="gameRoot" aria-label="Khu vực trò chơi"></main>

  <header class="hub-topbar" id="hubTopbar" hidden>
    <div class="hub-brand"><span class="hub-brand-icon">✦</span><span>MINI GAME WORLD</span></div>
    <div class="hub-topbar-right">
      <span id="activeGameName" class="active-game-name">Game đang mở</span>
      <button id="openGameMenu" class="switch-game-button" type="button">🎮 ĐỔI GAME</button>
    </div>
  </header>

  <section id="gameMenu" class="game-menu is-open" aria-hidden="false">
    <div class="menu-backdrop"></div>
    <div class="menu-dialog" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <div class="menu-eyebrow">WELCOME TO MINI GAME WORLD</div>
      <h1 id="menuTitle">Chọn trò chơi</h1>
      <p class="menu-subtitle">Chọn một thế giới để bắt đầu trải nghiệm.</p>

      <div class="game-cards">
        <button class="game-card farm-card" data-game="farm" type="button">
          <span class="card-art farm-art" aria-hidden="true">
            <span class="sun">☀</span>
            <span class="cloud cloud-one">☁</span>
            <span class="farm-hill hill-one"></span>
            <span class="farm-hill hill-two"></span>
            <span class="barn-emoji">🏡</span>
            <span class="sheep-emoji sheep-one">🐑</span>
            <span class="sheep-emoji sheep-two">🐑</span>
            <span class="sheep-emoji sheep-three">🐑</span>
            <span class="tree-emoji">🌳</span>
          </span>
          <span class="card-copy">
            <span class="card-title">🐑 Nông Trại Cừu</span>
            <span class="card-description">Thả sói, theo dõi đàn cừu và tìm người chơi cuối cùng.</span>
            <span class="card-cta">VÀO NÔNG TRẠI <b>↗</b></span>
          </span>
        </button>

        <button class="game-card claw-card" data-game="claw" type="button">
          <span class="card-art claw-art" aria-hidden="true">
            <span class="claw-stars">✦　✧　✦</span>
            <span class="toy toy-blue">🐻</span>
            <span class="toy toy-pink">🐰</span>
            <span class="toy toy-yellow">🐥</span>
            <span class="machine-claw">⌄</span>
            <span class="machine-glow"></span>
          </span>
          <span class="card-copy">
            <span class="card-title">🧸 Máy Gắp Thú</span>
            <span class="card-description">Điều khiển cần gắp và thu thập thú bông mang tên người chơi.</span>
            <span class="card-cta">VÀO MÁY GẮP <b>↗</b></span>
          </span>
        </button>
      </div>

      <div id="continueRow" class="continue-row" hidden>
        <span>Đang có một trò chơi mở.</span>
        <button id="continueGame" type="button">TIẾP TỤC TRÒ CHƠI</button>
      </div>
      <div class="menu-footer">ONE LINK · TWO GAMES · ENDLESS FUN</div>
    </div>
  </section>
</body>
<script src="./hub.js" defer></script>
</html>
